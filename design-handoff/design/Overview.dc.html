<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<title>Solana AI Kit website · overview</title>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="_ds/classical-b0c6d1fc-992f-48a2-a6e8-c8b1280345f0/styles.css">
<script src="_ds/classical-b0c6d1fc-992f-48a2-a6e8-c8b1280345f0/_ds_bundle.js"></script>
<style>
@font-face{font-family:"VT323";src:url("fonts/vt323-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;size-adjust:125%;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"VT323";src:url("fonts/vt323-latin-ext-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;size-adjust:125%;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"VT323";src:url("fonts/vt323-vietnamese-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;size-adjust:125%;unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
:root{--font-heading:"VT323","IBM Plex Mono",ui-monospace,monospace;--font-heading-weight:400;--font-body:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--mono:"VT323","IBM Plex Mono",ui-monospace,monospace;--color-bg:#0a0d0b;--color-surface:#111613;--color-text:#e2ede6;--color-accent:#14f195;--color-divider:color-mix(in srgb,#e2ede6 14%,transparent);--line-strong:color-mix(in srgb,#e2ede6 40%,transparent);--muted:#9daea4;--ink-accent:#14f195;--shadow-sm:0 0 0 1px rgba(0,0,0,.4);--shadow-md:0 8px 24px rgba(0,0,0,.5);--shadow-lg:0 16px 40px rgba(0,0,0,.6);color-scheme:dark}
body{margin:0;background:#060807;color:var(--color-text);font-family:var(--font-body)}
a{color:var(--ink-accent)}a:hover{color:var(--color-text)}
</style>
</helmet>
<div style="padding:72px;background:#060807;min-width:max-content;display:flex;flex-direction:column;gap:88px">
  <header style="max-width:900px;display:flex;flex-direction:column;gap:14px">
    <p style="font-family:var(--mono);font-size:13px;color:var(--muted);margin:0">Solana AI Kit · website · v1</p>
    <h1 style="font-family:var(--font-heading);font-weight:400;font-size:72px;line-height:1;margin:0;font-variant-numeric:lining-nums">Every screen at 1440 and 390</h1>
    <p style="font-size:18px;line-height:1.6;color:var(--muted);margin:0;max-width:70ch">Each frame is the live page. Scroll inside a frame, or open it full size. Light frames use <code style="font-family:var(--mono);font-size:15px">?theme=light</code>; everything else is the dark default.</p>
  </header>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
    <section id="{{ g.id }}" style="display:flex;flex-direction:column;gap:24px">
      <div style="display:flex;align-items:baseline;gap:18px;border-top:1px solid var(--line-strong);padding-top:20px">
        <span style="font-family:var(--mono);font-size:14px;color:var(--ink-accent)">{{ g.n }}</span>
        <h2 style="font-family:var(--font-heading);font-weight:400;font-size:44px;margin:0">{{ g.title }}</h2>
        <span style="font-family:var(--mono);font-size:13px;color:var(--muted)">{{ g.path }}</span>
      </div>
      <div style="display:flex;gap:40px;align-items:flex-start">
        <sc-for list="{{ g.frames }}" as="f" hint-placeholder-count="3">
          <figure style="margin:0;display:flex;flex-direction:column;gap:10px">
            <figcaption style="margin:0;display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:13px;color:var(--color-text)">
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="color:var(--ink-accent)">{{ f.id }}</span> · {{ f.label }}</span>
              <a href="{{ f.src }}" target="_blank" rel="noopener" style="font-size:12px;white-space:nowrap">open ↗</a>
            </figcaption>
            <div style="width:{{ f.w }};height:{{ f.h }};overflow:hidden;border:1px solid var(--line-strong);border-radius:4px;background:var(--color-bg)">
              <iframe src="{{ f.src }}" title="{{ f.label }}" loading="lazy" style="width:{{ f.iw }};height:{{ f.ih }};border:0;transform:scale({{ f.s }});transform-origin:0 0;display:block"></iframe>
            </div>
          </figure>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const D = (src, label, opts = {}) => ({ src, label, mobile: false, ...opts });
const M = (src, label, opts = {}) => ({ src, label, mobile: true, ...opts });
const GROUPS = [
  { title: 'Homepage', path: '/', frames: [D('Home.dc.html', '1440 · dark'), M('Home.dc.html', '390 · dark'), D('Home.dc.html?theme=light', '1440 · light'), M('Home.dc.html?theme=light', '390 · light')] },
  { title: 'Catalog', path: '/skills · /agents · /commands', frames: [D('Catalog.dc.html?kind=skills', '/skills grid · 1440 · dark'), D('Catalog.dc.html?kind=skills&view=list&theme=light', '/skills list · 1440 · light'), M('Catalog.dc.html?kind=skills', '/skills · 390 · dark'), D('Catalog.dc.html?kind=agents', '/agents · 1440 · dark'), M('Catalog.dc.html?kind=commands&view=list&theme=light', '/commands list · 390 · light')] },
  { title: 'Skill pack detail', path: '/skills/<id>', frames: [D('Detail.dc.html?kind=skills&id=jupiter', '/skills/jupiter · 1440 · dark'), M('Detail.dc.html?kind=skills&id=jupiter', '/skills/jupiter · 390 · dark'), D('Detail.dc.html?kind=skills&id=solana-dev&theme=light', '/skills/solana-dev · 1440 · light'), M('Detail.dc.html?kind=skills&id=solana-dev&theme=light', '/skills/solana-dev · 390 · light')] },
  { title: 'Agent and command detail', path: '/agents/<name> · /commands/<name>', frames: [D('Detail.dc.html?kind=agents&id=anchor-engineer', '/agents/anchor-engineer · 1440 · dark'), M('Detail.dc.html?kind=agents&id=anchor-engineer', '390 · dark'), D('Detail.dc.html?kind=commands&id=audit-solana&theme=light', '/commands/audit-solana · 1440 · light'), M('Detail.dc.html?kind=commands&id=audit-solana&theme=light', '390 · light')] },
  { title: 'Localized homepage', path: '/br · pt-BR', frames: [D('Home pt-BR.dc.html', '/br · 1440 · dark'), M('Home pt-BR.dc.html', '/br · 390 · dark'), D('Home pt-BR.dc.html?theme=light', '/br · 1440 · light'), M('Home pt-BR.dc.html?theme=light', '/br · 390 · light')] },
  { title: 'Markdown twins, llms.txt, head spec', path: '/skills/jupiter.md · /llms.txt · /llms-full.txt', frames: [D('Markdown Twins.dc.html', '1440 · dark'), M('Markdown Twins.dc.html?theme=light', '390 · light')] },
  { title: 'Components and tokens', path: 'component set · both themes', frames: [D('Components and Tokens.dc.html', '1440 · dark'), M('Components and Tokens.dc.html', '390 · dark')] }
];
class Component extends DCLogic {
  renderVals() {
    return {
      groups: GROUPS.map((g, gi) => ({
        ...g, n: String(gi + 1).padStart(2, '0'), id: 's' + (gi + 1),
        frames: g.frames.map((f, fi) => {
          const iw = f.mobile ? 390 : 1440, ih = f.mobile ? 2000 : 2400, s = f.mobile ? 0.75 : 0.5;
          return {
            id: (gi + 1) + String.fromCharCode(97 + fi), label: f.label, src: encodeURI(f.src),
            iw: iw + 'px', ih: ih + 'px', s: String(s), w: iw * s + 'px', h: ih * s + 'px'
          };
        })
      }))
    };
  }
}
</script>
</body>
</html>
