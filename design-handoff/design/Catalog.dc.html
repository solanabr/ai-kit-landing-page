<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<title>Skills · Solana AI Kit</title>
<link rel="alternate" type="text/markdown" href="https://aikit.superteam.codes/skills.md">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="_ds/classical-b0c6d1fc-992f-48a2-a6e8-c8b1280345f0/styles.css">
<script src="_ds/classical-b0c6d1fc-992f-48a2-a6e8-c8b1280345f0/_ds_bundle.js"></script>
<style>
@font-face{font-family:"VT323";src:url("fonts/vt323-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;size-adjust:125%;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"VT323";src:url("fonts/vt323-latin-ext-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;size-adjust:125%;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"VT323";src:url("fonts/vt323-vietnamese-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;size-adjust:125%;unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
:root,[data-theme="dark"]{--font-heading:"VT323","IBM Plex Mono",ui-monospace,monospace;--font-heading-weight:400;--font-body:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--mono:"VT323","IBM Plex Mono",ui-monospace,monospace;--color-bg:#0a0d0b;--color-surface:#111613;--color-text:#e2ede6;--color-accent:#14f195;--color-divider:color-mix(in srgb,#e2ede6 14%,transparent);--line-strong:color-mix(in srgb,#e2ede6 40%,transparent);--muted:#9daea4;--ink-accent:#14f195;--shadow-sm:0 0 0 1px rgba(0,0,0,.4);--shadow-md:0 8px 24px rgba(0,0,0,.5);--shadow-lg:0 16px 40px rgba(0,0,0,.6);color-scheme:dark}
[data-theme="light"]{--color-bg:#f2f4f2;--color-surface:#e7ebe8;--color-text:#111814;--color-accent:#0a8f58;--color-divider:color-mix(in srgb,#111814 16%,transparent);--line-strong:color-mix(in srgb,#111814 52%,transparent);--muted:#4c5751;--ink-accent:#08683f;--shadow-sm:0 1px 2px color-mix(in srgb,#111814 14%,transparent);--shadow-md:0 3px 10px color-mix(in srgb,#111814 16%,transparent);--shadow-lg:0 12px 32px color-mix(in srgb,#111814 22%,transparent);color-scheme:light}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--ink-accent)}a:hover{color:var(--color-text)}
summary{list-style:none}summary::-webkit-details-marker{display:none}
input[type="search"]::-webkit-search-cancel-button{filter:grayscale(1)}
</style>
</helmet>
<div data-screen-label="Catalog" style="min-height:100vh;background:var(--color-bg);color:var(--color-text)">
  <dc-import name="Nav" lang="en" active="{{ kind }}" stars="{{ stars }}" hint-size="100%,62px"></dc-import>
  <main style="max-width:1120px;margin:0 auto;padding:0 clamp(20px,5vw,56px)">
    <header style="padding:clamp(24px,4vw,40px) 0 18px;display:flex;flex-direction:column;gap:12px">
      <nav aria-label="Catalogs" style="display:flex;gap:4px;flex-wrap:wrap">
        <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="3">
          <a href="{{ k.href }}" aria-current="{{ k.current }}" style="font-family:var(--mono);font-size:13px;padding:6px 12px;border:1px solid {{ k.border }};border-radius:var(--radius-md);color:{{ k.color }};text-decoration:none" style-hover="color:var(--color-text)">/{{ k.id }}</a>
        </sc-for>
      </nav>
      <h1 style="font-family:var(--font-heading);font-weight:400;font-size:clamp(36px,4.6vw,56px);line-height:1;letter-spacing:0;margin:0">{{ title }}</h1>
      <p style="font-family:var(--mono);font-size:13px;color:var(--muted);margin:0;text-wrap:pretty">{{ summary }}</p>
    </header>

    <div role="search" style="display:flex;flex-direction:column;gap:14px;padding:12px 0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)">
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <label style="flex:1 1 280px;position:relative;display:block">
          <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">{{ searchLabel }}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:absolute;left:12px;top:50%;transform:translateY(-50%)"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input type="search" class="input" value="{{ q }}" onInput="{{ onSearch }}" placeholder="{{ searchPh }}" style="font-family:var(--mono);font-size:14px;min-height:44px;padding-left:38px;border-color:var(--line-strong)">
        </label>
        <sc-if value="{{ isSkills }}" hint-placeholder-val="{{ true }}">
          <div role="radiogroup" aria-label="Install state" class="seg" style="border-color:var(--line-strong)">
            <sc-for list="{{ defOpts }}" as="o" hint-placeholder-count="3">
              <button type="button" role="radio" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}" class="seg-opt" style="font-family:var(--mono);font-size:12px;min-height:44px;background:{{ o.bg }};border:0;border-left:{{ o.sep }};color:{{ o.color }};box-shadow:{{ o.ring }}">{{ o.label }}</button>
            </sc-for>
          </div>
        </sc-if>
        <div role="radiogroup" aria-label="View" class="seg" style="border-color:var(--line-strong)">
          <button type="button" role="radio" aria-checked="{{ gridSel }}" aria-label="Grid view" onClick="{{ setGrid }}" class="seg-opt" style="min-height:44px;min-width:44px;justify-content:center;background:transparent;border:0;color:{{ gridColor }};box-shadow:{{ gridRing }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg></button>
          <button type="button" role="radio" aria-checked="{{ listSel }}" aria-label="List view" onClick="{{ setList }}" class="seg-opt" style="min-height:44px;min-width:44px;justify-content:center;background:transparent;border:0;border-left:1px solid var(--color-divider);color:{{ listColor }};box-shadow:{{ listRing }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h.01"></path><path d="M3 18h.01"></path><path d="M3 6h.01"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M8 6h13"></path></svg></button>
        </div>
      </div>
      <div role="group" aria-label="Filter by tag" style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ tags }}" as="t" hint-placeholder-count="9">
          <button type="button" aria-pressed="{{ t.on }}" onClick="{{ t.toggle }}" style="font-family:var(--mono);font-size:12px;line-height:1;padding:9px 11px;min-height:34px;cursor:pointer;border-radius:var(--radius-sm);border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.color }}" style-hover="border-color:var(--color-accent)">{{ t.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding:10px 0 14px;font-family:var(--mono);font-size:12px;color:var(--muted)">
      <span aria-live="polite">{{ resultText }}</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span style="border:1px dashed var(--line-strong);border-radius:var(--radius-sm);padding:2px 5px;font-size:10px">sample</span>{{ sampleNote }}</span>
    </div>

    <sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
          <dc-import name="CatalogCard" item="{{ it }}" kind="{{ kind }}" view="grid" hint-size="100%,250px"></dc-import>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
      <div style="border-top:1px solid var(--color-divider)">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
          <dc-import name="CatalogCard" item="{{ it }}" kind="{{ kind }}" view="list" hint-size="100%,72px"></dc-import>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="padding:48px 0;text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted)">No matches. <button type="button" onClick="{{ reset }}" style="font:inherit;color:var(--ink-accent);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px">Clear filters</button></div>
    </sc-if>
  </main>
  <dc-import name="Footer" lang="en" version="2.4.0" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;skills&quot;,&quot;agents&quot;,&quot;commands&quot;],&quot;default&quot;:&quot;skills&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;list&quot;],&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  _q = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(); } })();
  state = { d: null, q: '', tags: [], def: 'all', view: this._q.get('view') || null };
  _init = (() => {
    try {
      let t = this._q.get('theme');
      if (!t) { try { t = localStorage.getItem('aikit-theme'); } catch (e) {} }
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      document.documentElement.lang = 'en';
    } catch (e) {}
  })();
  componentDidMount() { import(new URL('kit-data.js', location.href).href).then(d => this.setState({ d })); }
  renderVals() {
    const kind = this._q.get('kind') || this.props.kind || 'skills';
    const view = this.state.view || this.props.view || 'grid';
    const d = this.state.d;
    const titles = { skills: 'Skills', agents: 'Agents', commands: 'Commands' };
    const seg = (sel) => ({ color: sel ? 'var(--ink-accent)' : 'var(--muted)', ring: sel ? 'inset 0 0 0 1px var(--color-accent)' : 'none' });
    const all = d ? d.cards(kind) : [];
    const q = this.state.q.trim().toLowerCase();
    const items = all.filter(it =>
      (!q || (it.title + ' ' + it.id + ' ' + it.desc + ' ' + it.maintainer).toLowerCase().includes(q)) &&
      (!this.state.tags.length || this.state.tags.some(t => it.tags.includes(t))) &&
      (kind !== 'skills' || this.state.def === 'all' || (this.state.def === 'default') === !!it.def)
    );
    const c = d ? d.KIT.counts : { packs: '', agents: '', commands: '', defaultPacks: '' };
    const total = { skills: c.packs, agents: c.agents, commands: c.commands }[kind];
    const summary = {
      skills: c.packs + ' skill packs from the ecosystem\'s own repositories · ' + c.defaultPacks + ' installed by default · each pinned to a commit and scanned',
      agents: c.agents + ' specialized agents · each one is chosen for a task and can hand off to another',
      commands: c.commands + ' workflow commands · type one in Claude Code to start a guided step'
    }[kind];
    const toggleTag = t => this.setState(s => ({ tags: s.tags.includes(t) ? s.tags.filter(x => x !== t) : [...s.tags, t] }));
    return {
      kind, stars: d ? d.KIT.stars : null, title: titles[kind], summary,
      kinds: ['skills', 'agents', 'commands'].map(k => ({ id: k, href: 'Catalog.dc.html?kind=' + k + '&view=' + view, current: k === kind ? 'page' : undefined, border: k === kind ? 'var(--color-accent)' : 'var(--color-divider)', color: k === kind ? 'var(--ink-accent)' : 'var(--muted)' })),
      isSkills: kind === 'skills', q: this.state.q, onSearch: e => this.setState({ q: e.target.value }),
      searchLabel: 'Search ' + titles[kind].toLowerCase(), searchPh: kind === 'skills' ? 'Search packs, maintainers, triggers' : 'Search ' + titles[kind].toLowerCase(),
      defOpts: [['all', 'All'], ['default', 'Installed by default'], ['demand', 'Add on demand']].map(([id, label], i) => ({
        label, sel: this.state.def === id ? 'true' : 'false', pick: () => this.setState({ def: id }),
        bg: 'transparent', sep: i ? '1px solid var(--color-divider)' : '0', ...(({ color, ring }) => ({ color, ring }))(seg(this.state.def === id))
      })),
      tags: (d ? d.TAGS : []).map(t => {
        const on = this.state.tags.includes(t);
        return { label: t, on: on ? 'true' : 'false', toggle: () => toggleTag(t), border: on ? 'var(--color-accent)' : 'var(--color-divider)', bg: on ? 'color-mix(in srgb,var(--color-accent) 14%,transparent)' : 'transparent', color: on ? 'var(--ink-accent)' : 'var(--color-text)' };
      }),
      gridSel: view === 'grid' ? 'true' : 'false', listSel: view === 'list' ? 'true' : 'false',
      gridColor: seg(view === 'grid').color, gridRing: seg(view === 'grid').ring, listColor: seg(view === 'list').color, listRing: seg(view === 'list').ring,
      setGrid: () => this.setState({ view: 'grid' }), setList: () => this.setState({ view: 'list' }),
      isGrid: view === 'grid', isList: view === 'list', items, empty: !!d && items.length === 0,
      resultText: d ? 'Showing ' + items.length + ' of ' + all.length + ' in this mock · ' + total + ' in the registry' : '',
      sampleNote: kind === 'skills' ? 'only solana-dev and jupiter carry real registry data' : 'descriptions and models are draft copy',
      reset: () => this.setState({ q: '', tags: [], def: 'all' })
    };
  }
}
</script>
</body>
</html>
