  </a>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Primary" style="display:flex;gap:32px;align-items:center">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" aria-current="{{ l.current }}" style="font-family:var(--mono);font-size:13px">{{ l.label }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <a href="https://github.com/solanabr/ai-kit" style="display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:13px;padding:6px 4px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
        <span>GitHub</span>
        <span title="{{ starsTitle }}" style="font-size:12px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--radius-sm);padding:2px 6px">★ {{ starsText }}</span>
      </a>
      <dc-import name="LangSwitch" lang="{{ lang }}" variant="menu" hint-size="78px,33px"></dc-import>
      <button type="button" class="btn btn-secondary btn-icon" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" style="width:34px;height:34px;color:var(--color-text)">
        <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg></sc-if>
        <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if>

    <button type="button" class="btn btn-secondary btn-icon" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-controls="mobile-menu" aria-label="{{ menuLabel }}" style="width:44px;height:44px;color:var(--color-text)">
      <sc-if value="{{ menuClosed }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></sc-if>

</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div id="mobile-menu" style="border-bottom:1px solid var(--color-divider);background:var(--color-bg);max-width:1120px;margin:0 auto;box-sizing:border-box;padding:8px clamp(20px,5vw,56px) 24px;display:flex;flex-direction:column">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
      <a href="{{ l.href }}" aria-current="{{ l.current }}" style="font-family:var(--mono);font-size:16px;padding:14px 0;border-bottom:1px solid var(--color-divider);color:var(--color-text);text-decoration:none">{{ l.label }}</a>
    </sc-for>
    <a href="https://github.com/solanabr/ai-kit" style="font-family:var(--mono);font-size:16px;padding:14px 0;border-bottom:1px solid var(--color-divider);color:var(--color-text);text-decoration:none">GitHub</a>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px">
      <dc-import name="LangSwitch" lang="{{ lang }}" variant="menu" hint-size="78px,33px"></dc-import>
      <button type="button" class="btn btn-secondary" onClick="{{ toggleTheme }}" style="font-family:var(--mono);font-size:13px;font-weight:400;min-height:44px;color:var(--color-text)">{{ themeLabel }}</button>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:80},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;br&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'br'&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;skills&quot;,&quot;agents&quot;,&quot;commands&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stars&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number|null&quot;}}">
class Component extends DCLogic {
  state = { narrow: false, open: false, theme: 'dark' };
  componentDidMount() {
    this.onR = () => this.setState({ narrow: window.innerWidth < 900 });
    this.onR();
    window.addEventListener('resize', this.onR);
    setTimeout(() => this.setState({ theme: document.documentElement.dataset.theme || 'dark' }), 0);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  toggleTheme = () => {
    const t = (document.documentElement.dataset.theme || 'dark') === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('aikit-theme', t); } catch (e) {}
    this.setState({ theme: t });
  };
  renderVals() {
    const br = this.props.lang === 'br';
    const labels = br ? ['Skills', 'Agentes', 'Comandos', 'Docs'] : ['Skills', 'Agents', 'Commands', 'Docs'];
    const keys = ['skills', 'agents', 'commands', 'docs'];
    const hrefs = ['Catalog.dc.html?kind=skills', 'Catalog.dc.html?kind=agents', 'Catalog.dc.html?kind=commands', 'https://github.com/solanabr/ai-kit#readme'];
    const s = this.props.stars;
    const open = this.state.narrow && this.state.open;
    return {
      links: keys.map((k, i) => ({ label: labels[i], href: hrefs[i], current: this.props.active === k ? 'page' : undefined })),
      wide: !this.state.narrow, narrow: this.state.narrow, menuOpen: open, menuClosed: !open,
      lang: this.props.lang || 'en', homeHref: br ? 'Home pt-BR.dc.html' : 'Home.dc.html',
      starsText: s == null ? '⟨stars⟩' : new Intl.NumberFormat('en', { notation: 'compact' }).format(s),
      starsTitle: s == null ? (br ? 'Placeholder: lido da API do GitHub no build' : 'Placeholder: fetched from the GitHub API at build') : 'GitHub stars',
      isDark: this.state.theme === 'dark', isLight: this.state.theme !== 'dark',
      toggleTheme: this.toggleTheme, toggleMenu: () => this.setState(st => ({ open: !st.open })),
      menuLabel: 'Menu', themeLabel: br ? 'Alternar tema' : 'Toggle theme'
    };
  }
}
</script>
</body>
